<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%" fill="none">
  <defs>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Left: BEFORE APEXSEO -->
  <g transform="translate(20, 20)" filter="url(#cardShadow)">
    <rect width="395" height="340" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <rect width="395" height="44" rx="14" fill="#fef2f2" />
    <path d="M 0 32 L 395 32" stroke="#fee2e2" stroke-width="1"/>
    
    <!-- Status badge -->
    <rect x="18" y="10" width="115" height="24" rx="6" fill="#dc2626"/>
    <text x="75" y="26" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">BEFORE APEXSEO</text>
    <text x="145" y="26" fill="#991b1b" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Rank #18 (Page 2)</text>
    
    <!-- Mock Search Snippet Container -->
    <rect x="20" y="55" width="355" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    
    <!-- URL -->
    <text x="36" y="80" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif">https://yourstore.com › p › item98231</text>
    
    <!-- Bad Title -->
    <text x="36" y="108" fill="#1d4ed8" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Untitled Document | Home...</text>
    
    <!-- Truncated bad description -->
    <text x="36" y="132" fill="#64748b" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Welcome to our store. We sell products online.</text>
    <text x="36" y="152" fill="#64748b" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Click here to see more about our catalog items...</text>
    
    <!-- Diagnostic tags -->
    <g transform="translate(20, 225)">
      <rect x="0" y="0" width="160" height="26" rx="6" fill="#fee2e2"/>
      <text x="10" y="17" fill="#b91c1c" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">✕ Missing Meta Description</text>
      
      <rect x="170" y="0" width="185" height="26" rx="6" fill="#fee2e2"/>
      <text x="180" y="17" fill="#b91c1c" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">✕ No Structured Schema (0 stars)</text>

      <rect x="0" y="34" width="150" height="26" rx="6" fill="#fee2e2"/>
      <text x="10" y="51" fill="#b91c1c" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">✕ Unoptimized Title Tag</text>

      <rect x="160" y="34" width="195" height="26" rx="6" fill="#fee2e2"/>
      <text x="170" y="51" fill="#b91c1c" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">✕ CTR: 0.8% (Lost Traffic)</text>
    </g>
  </g>

  <!-- Right: AFTER APEXSEO AUTOPILOT -->
  <g transform="translate(445, 20)" filter="url(#cardShadow)">
    <rect width="395" height="340" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect width="395" height="44" rx="14" fill="#f0fdf4" />
    <path d="M 0 32 L 395 32" stroke="#dcfce7" stroke-width="1"/>
    
    <!-- Status badge -->
    <rect x="18" y="10" width="125" height="24" rx="6" fill="#16a34a"/>
    <text x="80" y="26" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">WITH APEXSEO</text>
    <text x="155" y="26" fill="#15803d" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Rank #1 (Top Result)</text>
    
    <!-- Mock Search Snippet Container -->
    <rect x="20" y="55" width="355" height="150" rx="10" fill="#f8fafc" stroke="#bbf7d0"/>
    
    <!-- Breadcrumb with schema -->
    <text x="36" y="78" fill="#15803d" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">https://yourstore.com › Products › Best-Sellers</text>
    
    <!-- Perfect Title -->
    <text x="36" y="102" fill="#1e40af" font-size="16" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Premium Minimalist Backpacks | Free Shipping</text>
    
    <!-- Rich Snippet Stars & Reviews -->
    <g transform="translate(36, 112)">
      <text x="0" y="11" fill="#f59e0b" font-size="13">★★★★★</text>
      <text x="65" y="11" fill="#475569" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Rating: 4.9 · 1,482 reviews · In stock · \$89.00</text>
    </g>

    <!-- Engaging AI Description -->
    <text x="36" y="142" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Engineered for daily commutes and travel. Water-resistant,</text>
    <text x="36" y="159" fill="#334155" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif">ergonomic straps, and lifetime warranty. Shop best sellers today.</text>
    
    <!-- Diagnostic tags -->
    <g transform="translate(20, 225)">
      <rect x="0" y="0" width="165" height="26" rx="6" fill="#dcfce7"/>
      <text x="10" y="17" fill="#15803d" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">✓ AI Title &amp; Description Injected</text>
      
      <rect x="175" y="0" width="180" height="26" rx="6" fill="#dcfce7"/>
      <text x="185" y="17" fill="#15803d" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">✓ Schema.org Product Rich Cards</text>

      <rect x="0" y="34" width="165" height="26" rx="6" fill="#dcfce7"/>
      <text x="10" y="51" fill="#15803d" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">✓ IndexNow Bot Dispatch</text>

      <rect x="175" y="34" width="180" height="26" rx="6" fill="#dcfce7"/>
      <text x="185" y="51" fill="#15803d" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">✓ CTR: 14.8% (+1850% Clicks)</text>
    </g>
  </g>
</svg>

