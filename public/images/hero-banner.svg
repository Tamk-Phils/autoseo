<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="windowShadow" x="-3%" y="-2%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.09" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Main Window Frame -->
  <g filter="url(#windowShadow)">
    <rect x="10" y="10" width="840" height="460" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Window Top Bar -->
    <rect x="10" y="10" width="840" height="46" rx="18" fill="#f8fafc" />
    <path d="M 10 56 L 850 56" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Window controls -->
    <circle cx="36" cy="33" r="5.5" fill="#f87171" />
    <circle cx="54" cy="33" r="5.5" fill="#fbbf24" />
    <circle cx="72" cy="33" r="5.5" fill="#34d399" />

    <!-- URL pill in top bar -->
    <rect x="270" y="20" width="320" height="26" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="286" cy="33" r="3.5" fill="#16a34a" />
    <text x="300" y="37" fill="#64748b" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500">https://app.apexseo.io/autopilot</text>
    <text x="565" y="37" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif">🔒</text>

    <!-- Top Sub-Header -->
    <g transform="translate(36, 74)">
      <text x="0" y="16" fill="#0f172a" font-size="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" letter-spacing="-0.02em">Autonomous Autopilot Telemetry</text>
      
      <!-- Live Status Badge -->
      <rect x="620" y="-4" width="168" height="28" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
      <circle cx="636" cy="10" r="4" fill="#16a34a" />
      <text x="648" y="14" fill="#15803d" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">AUTOPILOT: ACTIVE</text>
    </g>

    <!-- 3 Core Metric Cards -->
    <g transform="translate(36, 115)">
      <!-- Card 1: Health Score -->
      <g>
        <rect width="248" height="88" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="18" y="28" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" letter-spacing="0.05em">SITE HEALTH SCORE</text>
        <text x="18" y="62" fill="#0f172a" font-size="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="850">98<tspan fill="#94a3b8" font-size="16" font-weight="500"> /100</tspan></text>
        <rect x="156" y="22" width="76" height="24" rx="12" fill="#dcfce7" />
        <text x="194" y="38" text-anchor="middle" fill="#15803d" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">+14 pts ▲</text>
      </g>

      <!-- Card 2: Changes Deployed -->
      <g transform="translate(268, 0)">
        <rect width="248" height="88" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="18" y="28" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" letter-spacing="0.05em">AUTONOMOUS FIXES</text>
        <text x="18" y="62" fill="#2563eb" font-size="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="850">3,429<tspan fill="#64748b" font-size="14" font-weight="500"> live</tspan></text>
        <rect x="160" y="22" width="72" height="24" rx="12" fill="#dbeafe" />
        <text x="196" y="38" text-anchor="middle" fill="#1e40af" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">⚡ 100% Auto</text>
      </g>

      <!-- Card 3: Organic Traffic Growth -->
      <g transform="translate(536, 0)">
        <rect width="252" height="88" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="18" y="28" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" letter-spacing="0.05em">ORGANIC SEARCH TRAFFIC</text>
        <text x="18" y="62" fill="#16a34a" font-size="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="850">+412%</text>
        <rect x="156" y="22" width="78" height="24" rx="12" fill="#dcfce7" />
        <text x="195" y="38" text-anchor="middle" fill="#15803d" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">🚀 Fast Rank</text>
      </g>
    </g>

    <!-- Growth Chart & Live Event Feed Grid -->
    <g transform="translate(36, 222)">
      <!-- Left: Real-time Rank Climb Chart -->
      <rect width="470" height="218" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="28" fill="#0f172a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">Average Keyword Ranking Position</text>
      <text x="400" y="28" text-anchor="end" fill="#16a34a" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">#1 Top 3 Positions</text>

      <!-- Chart grid lines -->
      <line x1="20" y1="65" x2="450" y2="65" stroke="#f1f5f9" stroke-width="1" />
      <line x1="20" y1="110" x2="450" y2="110" stroke="#f1f5f9" stroke-width="1" />
      <line x1="20" y1="155" x2="450" y2="155" stroke="#f1f5f9" stroke-width="1" />
      <line x1="20" y1="195" x2="450" y2="195" stroke="#e2e8f0" stroke-width="1" />

      <!-- Chart Curve -->
      <path d="M 20 180 Q 90 170 160 145 T 300 85 T 450 48 L 450 195 L 20 195 Z" fill="url(#chartGrad)"/>
      <path d="M 20 180 Q 90 170 160 145 T 300 85 T 450 48" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- Node pin -->
      <circle cx="450" cy="48" r="7" fill="#2563eb" />
      <circle cx="450" cy="48" r="3.5" fill="#ffffff" />
      
      <!-- Floating tooltip on peak -->
      <rect x="330" y="38" width="105" height="24" rx="6" fill="#0f172a" />
      <text x="382" y="54" text-anchor="middle" fill="#ffffff" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">Position 1.2 ★</text>

      <!-- Month labels -->
      <text x="25" y="210" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Week 1</text>
      <text x="160" y="210" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Week 2</text>
      <text x="300" y="210" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Week 3</text>
      <text x="425" y="210" fill="#2563eb" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">Today</text>

      <!-- Right: Real-time Autonomous Event Feed -->
      <g transform="translate(488, 0)">
        <rect width="300" height="218" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="18" y="28" fill="#0f172a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">Live Optimization Log</text>

        <!-- Feed Item 1 -->
        <g transform="translate(18, 48)">
          <rect width="264" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <circle cx="16" cy="23" r="5" fill="#16a34a" />
          <text x="30" y="20" fill="#0f172a" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">Product Schema Injected</text>
          <text x="30" y="34" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">JSON-LD 4.9★ rating added · 2m ago</text>
        </g>

        <!-- Feed Item 2 -->
        <g transform="translate(18, 102)">
          <rect width="264" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <circle cx="16" cy="23" r="5" fill="#2563eb" />
          <text x="30" y="20" fill="#0f172a" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">Title Tag Optimized</text>
          <text x="30" y="34" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">High-CTR keywords injected · 8m ago</text>
        </g>

        <!-- Feed Item 3 -->
        <g transform="translate(18, 156)">
          <rect width="264" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <circle cx="16" cy="23" r="5" fill="#8b5cf6" />
          <text x="30" y="20" fill="#0f172a" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">IndexNow Fast Ping</text>
          <text x="30" y="34" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Bing &amp; Copilot notified · 14m ago</text>
        </g>
      </g>
    </g>
  </g>
</svg>
