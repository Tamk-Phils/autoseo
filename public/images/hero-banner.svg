<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.0" />
    </linearGradient>
    <filter id="floatShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="400" rx="20" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Grid lines -->
  <line x1="80" y1="80" x2="720" y2="80" stroke="#f1f5f9" stroke-width="1.5" />
  <line x1="80" y1="160" x2="720" y2="160" stroke="#f1f5f9" stroke-width="1.5" />
  <line x1="80" y1="240" x2="720" y2="240" stroke="#f1f5f9" stroke-width="1.5" />
  <line x1="80" y1="320" x2="720" y2="320" stroke="#f1f5f9" stroke-width="1.5" />

  <!-- Main Dashboard Card -->
  <g transform="translate(80, 50)" filter="url(#floatShadow)">
    <rect width="640" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect width="640" height="40" rx="16" fill="#f8fafc"/>
    <path d="M 0 32 L 640 32" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5" fill="#f59e0b" />
    <circle cx="59" cy="20" r="5" fill="#10b981" />
    <rect x="220" y="10" width="200" height="20" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="320" y="24" text-anchor="middle" fill="#64748b" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif">apexseo.io/autopilot</text>

    <!-- Metrics Row -->
    <g transform="translate(30, 55)">
      <!-- Metric 1 -->
      <rect width="170" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="25" fill="#64748b" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">HEALTH SCORE</text>
      <text x="15" y="52" fill="#16a34a" font-size="22" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, sans-serif">96 / 100</text>
      <circle cx="140" cy="35" r="14" fill="#dcfce7"/>
      <text x="140" y="39" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="700">▲</text>

      <!-- Metric 2 -->
      <rect x="190" width="190" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="205" y="25" fill="#64748b" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">AUTONOMOUS CHANGES</text>
      <text x="205" y="52" fill="#2563eb" font-size="22" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, sans-serif">2,481 Live</text>
      <circle cx="350" cy="35" r="14" fill="#dbeafe"/>
      <text x="350" y="39" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="700">⚡</text>

      <!-- Metric 3 -->
      <rect x="400" width="180" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="415" y="25" fill="#64748b" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">ORGANIC TRAFFIC</text>
      <text x="415" y="52" fill="#0f172a" font-size="22" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, sans-serif">+348%</text>
      <circle cx="550" cy="35" r="14" fill="#f1f5f9"/>
      <text x="550" y="39" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">🚀</text>
    </g>

    <!-- Growth Graph Area -->
    <g transform="translate(30, 145)">
      <!-- Area fill -->
      <path d="M 0 110 Q 90 95 180 80 T 360 45 T 580 15 L 580 120 L 0 120 Z" fill="url(#chartGrad)"/>
      <!-- Curve stroke -->
      <path d="M 0 110 Q 90 95 180 80 T 360 45 T 580 15" stroke="#2563eb" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      
      <!-- Pulsing Node at the peak -->
      <circle cx="580" cy="15" r="8" fill="#2563eb" />
      <circle cx="580" cy="15" r="4" fill="#ffffff" />

      <!-- Annotations -->
      <rect x="460" y="2" width="110" height="24" rx="6" fill="#0f172a"/>
      <text x="515" y="17" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Page 1 #1 Rank</text>
    </g>
  </g>
</svg>

